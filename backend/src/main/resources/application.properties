# Playwright Studio AI Spring Boot Configuration
server.port=8099
spring.application.name=playwright-studio-backend

# Logging configuration
logging.level.root=INFO
logging.level.com.playwrightstudio=DEBUG

# Recorder child process settings
playwright.recorder.script=recorder/dist/cli.js
playwright.recorder.launchTimeoutSeconds=15

# Framework validation (deterministic tsc --noEmit gate) child process settings
playwright.validator.script=recorder/dist/validateFramework.js
playwright.validator.timeoutSeconds=60
